<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>實驗室 · 取樣管理</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap');

  :root {
    --bg: #0d1520;
    --surface: #131e2e;
    --surface2: #1a2840;
    --border: #253450;
    --accent: #4da6ff;
    --accent-dim: rgba(77,166,255,0.12);
    --green: #00e5a0;
    --green-dim: rgba(0,229,160,0.1);
    --warn: #ff6b35;
    --text: #d8e4f0;
    --muted: #5a7a99;
    --input-bg: #0d1520;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans TC', sans-serif;
    min-height: 100vh;
  }

  /* ── Header ── */
  header {
    padding: 20px 28px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .header-icon {
    font-size: 20px;
    line-height: 1;
  }
  header h1 {
    font-family: 'Space Mono', monospace;
    font-size: 14px;
    letter-spacing: 2px;
    color: var(--accent);
    text-transform: uppercase;
  }
  .header-badge {
    margin-left: auto;
    font-size: 11px;
    font-family: 'Space Mono', monospace;
    color: var(--accent);
    background: var(--accent-dim);
    border: 1px solid var(--accent);
    border-radius: 20px;
    padding: 3px 12px;
    letter-spacing: 1px;
  }

  /* ── Layout ── */
  .layout {
    display: grid;
    grid-template-columns: 380px 1fr;
    gap: 0;
    min-height: calc(100vh - 65px);
  }

  /* ── Left Panel: Form ── */
  .panel-left {
    border-right: 1px solid var(--border);
    padding: 28px;
    background: var(--surface);
  }

  .panel-title {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .panel-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .form-group { margin-bottom: 18px; }
  label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
    font-family: 'Space Mono', monospace;
    letter-spacing: 1px;
  }
  input {
    width: 100%;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 14px;
    color: var(--text);
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    transition: border-color .2s;
    outline: none;
  }
  input:focus { border-color: var(--accent); }
  input::placeholder { color: var(--muted); }

  .wo-hint {
    font-size: 11px;
    color: var(--muted);
    margin-top: 5px;
  }

  .btn {
    width: 100%;
    padding: 12px;
    border-radius: 6px;
    border: none;
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: all .2s;
    letter-spacing: 1px;
  }
  .btn-primary {
    background: var(--accent);
    color: #0d1520;
  }
  .btn-primary:hover { box-shadow: 0 4px 16px rgba(77,166,255,.3); transform: translateY(-1px); }
  .btn-primary:active { transform: translateY(0); }
  .btn-primary:disabled { opacity: .5; cursor: not-allowed; transform: none; }

  .btn-secondary {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    margin-top: 8px;
  }
  .btn-secondary:hover { border-color: var(--muted); color: var(--text); }

  /* ── Right Panel: List ── */
  .panel-right { padding: 28px; overflow-y: auto; }

  .list-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
  }
  .list-count {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    margin-left: auto;
  }

  /* ── Table ── */
  .table-wrap { overflow-x: auto; }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  th {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
    text-align: left;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  td {
    padding: 12px 14px;
    border-bottom: 1px solid rgba(37,52,80,.5);
    vertical-align: middle;
  }
  tr:hover td { background: var(--accent-dim); }
  tr.done-row td { opacity: .55; }

  .code-cell {
    font-family: 'Space Mono', monospace;
    color: var(--accent);
    font-size: 12px;
  }
  .wo-cell {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
  }
  .wo-cell.empty { color: var(--muted); }

  .status-badge {
    display: inline-block;
    font-size: 11px;
    font-family: 'Space Mono', monospace;
    padding: 2px 8px;
    border-radius: 4px;
    white-space: nowrap;
  }
  .status-pending {
    background: rgba(255,107,53,.12);
    color: #ff9b6e;
    border: 1px solid rgba(255,107,53,.3);
  }
  .status-done {
    background: var(--green-dim);
    color: var(--green);
    border: 1px solid rgba(0,229,160,.3);
  }

  .time-cell {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
  }

  /* ── Action buttons ── */
  .action-btns { display: flex; gap: 6px; }
  .btn-edit, .btn-del {
    border: none;
    border-radius: 4px;
    padding: 4px 10px;
    font-size: 11px;
    font-family: 'Space Mono', monospace;
    cursor: pointer;
    transition: all .15s;
  }
  .btn-edit {
    background: var(--accent-dim);
    color: var(--accent);
    border: 1px solid rgba(77,166,255,.2);
  }
  .btn-edit:hover { background: var(--accent); color: #0d1520; }
  .btn-del {
    background: rgba(255,107,53,.1);
    color: var(--warn);
    border: 1px solid rgba(255,107,53,.2);
  }
  .btn-del:hover { background: var(--warn); color: white; }

  /* ── Empty / Loading ── */
  .empty {
    text-align: center;
    padding: 60px;
    color: var(--muted);
    font-size: 13px;
  }
  .spinner {
    width: 20px; height: 20px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .8s linear infinite;
    margin: 0 auto 10px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Toast ── */
  #toast {
    position: fixed;
    bottom: 24px; right: 24px;
    padding: 12px 20px;
    border-radius: 8px;
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    opacity: 0;
    transform: translateY(8px);
    transition: all .3s;
    pointer-events: none;
    z-index: 999;
    background: var(--green);
    color: #0d1520;
  }
  #toast.show { opacity: 1; transform: translateY(0); }
  #toast.error { background: var(--warn); color: white; }

  /* ── Edit mode indicator ── */
  .edit-indicator {
    display: none;
    background: var(--accent-dim);
    border: 1px solid var(--accent);
    border-radius: 6px;
    padding: 10px 14px;
    font-size: 12px;
    color: var(--accent);
    margin-bottom: 16px;
  }
  .edit-indicator.show { display: block; }

  @media (max-width: 768px) {
    .layout { grid-template-columns: 1fr; }
    .panel-left { border-right: none; border-bottom: 1px solid var(--border); }
  }
</style>
</head>
<body>

<header>
  <span class="header-icon">🔬</span>
  <h1>實驗室取樣管理</h1>
  <span class="header-badge">LAB</span>
</header>

<div class="layout">
  <!-- ── Left: Add / Edit Form ── -->
  <aside class="panel-left">
    <p class="panel-title">新增 / 編輯</p>

    <div class="edit-indicator" id="edit-indicator">
      ✏️ 編輯模式：修改後按儲存
    </div>

    <div class="form-group">
      <label>料號 ITEM CODE</label>
      <input id="f-code" type="text" placeholder="11001026" maxlength="30">
    </div>
    <div class="form-group">
      <label>名稱 ITEM NAME</label>
      <input id="f-name" type="text" placeholder="植物固醇">
    </div>
    <div class="form-group">
      <label>對應工單 WORK ORDER <span style="color:var(--muted);font-weight:400">（選填）</span></label>
      <input id="f-wo" type="text" placeholder="10091560">
      <p class="wo-hint">可留空，之後再修改</p>
    </div>

    <input type="hidden" id="edit-id">

    <button class="btn btn-primary" id="btn-submit" onclick="submitForm()">＋ 新增取樣項目</button>
    <button class="btn btn-secondary" id="btn-cancel" onclick="cancelEdit()" style="display:none">取消編輯</button>
  </aside>

  <!-- ── Right: List ── -->
  <main class="panel-right">
    <div class="list-header">
      <p class="panel-title" style="margin:0">取樣清單</p>
      <span class="list-count" id="list-count">載入中…</span>
      <button class="btn-edit" onclick="loadData()" style="margin-left:8px">↻ 重新整理</button>
    </div>

    <div class="table-wrap">
      <table id="data-table">
        <thead>
          <tr>
            <th>料號</th>
            <th>名稱</th>
            <th>工單</th>
            <th>狀態</th>
            <th>建立時間</th>
            <th>完成時間</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="tbody">
          <tr><td colspan="7"><div class="spinner"></div></td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<div id="toast"></div>

<script>
// ══════════════════════════════════════════════
//  ⚠️  請填入你的 Supabase 設定
// ══════════════════════════════════════════════
const SUPABASE_URL = 'https://nlaaryttsnwwwfdwasvm.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_VtDFu5_XYvrI-1nr1NJdUw_8EeG5zkk';
const TABLE = 'lab_samples';
// ══════════════════════════════════════════════

let allData = [];
let editingId = null;

// ── API ──
async function apiFetch(method, path, body) {
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, {
    method,
    headers: {
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
      'Content-Type': 'application/json',
      'Prefer': method === 'POST' ? 'return=representation' : 'return=minimal',
    },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!res.ok) throw new Error(await res.text());
  return res.status === 204 ? null : res.json();
}

async function loadData() {
  try {
    const data = await apiFetch('GET', `${TABLE}?order=created_at.desc&select=*`);
    allData = data;
    renderTable();
  } catch(e) {
    document.getElementById('tbody').innerHTML = `<tr><td colspan="7" class="empty">載入失敗：請確認 Supabase 設定</td></tr>`;
  }
}

// ── Render ──
function renderTable() {
  const count = allData.length;
  const pending = allData.filter(r => r.status === 'pending').length;
  document.getElementById('list-count').textContent = `共 ${count} 筆 | 待備料 ${pending} 筆`;

  if (!count) {
    document.getElementById('tbody').innerHTML = `<tr><td colspan="7"><div class="empty">尚無取樣項目，請從左側新增</div></td></tr>`;
    return;
  }

  document.getElementById('tbody').innerHTML = allData.map(r => {
    const isDone = r.status === 'done';
    const wo = r.work_order
      ? `<span class="wo-cell">${r.work_order}</span>`
      : `<span class="wo-cell empty">—</span>`;
    const status = isDone
      ? `<span class="status-badge status-done">✓ 完成</span>`
      : `<span class="status-badge status-pending">待備料</span>`;
    return `
    <tr class="${isDone?'done-row':''}">
      <td class="code-cell">${r.item_code}</td>
      <td>${r.item_name}</td>
      <td>${wo}</td>
      <td>${status}</td>
      <td class="time-cell">${formatTime(r.created_at)}</td>
      <td class="time-cell">${r.done_at ? formatTime(r.done_at) : '—'}</td>
      <td>
        <div class="action-btns">
          <button class="btn-edit" onclick="startEdit('${r.id}')">編輯</button>
          <button class="btn-del" onclick="deleteRow('${r.id}')">刪除</button>
        </div>
      </td>
    </tr>`;
  }).join('');
}

function formatTime(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleString('zh-TW', {
    month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit'
  });
}

// ── Form ──
async function submitForm() {
  const code = document.getElementById('f-code').value.trim();
  const name = document.getElementById('f-name').value.trim();
  const wo   = document.getElementById('f-wo').value.trim();

  if (!code || !name) { showToast('料號與名稱為必填', true); return; }

  const btn = document.getElementById('btn-submit');
  btn.disabled = true;
  btn.textContent = '處理中…';

  try {
    if (editingId) {
      await apiFetch('PATCH', `${TABLE}?id=eq.${editingId}`, {
        item_code: code,
        item_name: name,
        work_order: wo || null,
      });
      showToast('已儲存修改');
      cancelEdit();
    } else {
      await apiFetch('POST', TABLE, {
        item_code: code,
        item_name: name,
        work_order: wo || null,
        status: 'pending',
      });
      showToast('已新增取樣項目');
      clearForm();
    }
    await loadData();
  } catch(e) {
    showToast('操作失敗', true);
  } finally {
    btn.disabled = false;
    btn.textContent = editingId ? '💾 儲存修改' : '＋ 新增取樣項目';
  }
}

function startEdit(id) {
  const row = allData.find(r => r.id === id);
  if (!row) return;
  editingId = id;
  document.getElementById('f-code').value = row.item_code;
  document.getElementById('f-name').value = row.item_name;
  document.getElementById('f-wo').value = row.work_order || '';
  document.getElementById('btn-submit').textContent = '💾 儲存修改';
  document.getElementById('btn-cancel').style.display = 'block';
  document.getElementById('edit-indicator').classList.add('show');
  document.getElementById('f-code').focus();
  window.scrollTo(0, 0);
}

function cancelEdit() {
  editingId = null;
  clearForm();
  document.getElementById('btn-submit').textContent = '＋ 新增取樣項目';
  document.getElementById('btn-cancel').style.display = 'none';
  document.getElementById('edit-indicator').classList.remove('show');
}

function clearForm() {
  ['f-code','f-name','f-wo'].forEach(id => document.getElementById(id).value = '');
}

async function deleteRow(id) {
  const row = allData.find(r => r.id === id);
  if (!row) return;
  if (!confirm(`確定刪除「${row.item_name}（${row.item_code}）」？`)) return;
  try {
    await apiFetch('DELETE', `${TABLE}?id=eq.${id}`);
    showToast('已刪除');
    await loadData();
  } catch(e) {
    showToast('刪除失敗', true);
  }
}

// ── Toast ──
function showToast(msg, isError=false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show' + (isError ? ' error' : '');
  setTimeout(() => t.className = '', 2500);
}

loadData();
</script>
</body>
</html>
